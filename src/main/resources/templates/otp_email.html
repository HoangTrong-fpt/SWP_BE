<!DOCTYPE html>
<html>
<body style="font-family: 'Helvetica Neue',Helvetica,Arial,sans-serif; background-color: #f6f6f6; margin: 0;">
<div style="max-width:600px; margin:40px auto; background:#fff; border:1px solid #e9e9e9; border-radius:8px; overflow:hidden;">
    <div style="background:#38414a; color:#fff; text-align:center; padding:32px 20px 20px 20px;">
        <h2 style="margin:0; font-size:32px;">quitsmoke.fun</h2>
        <div style="margin-top:10px; font-size:16px;">Đặt lại mật khẩu</div>
    </div>
    <div style="padding:24px;">
        <p>Xin chào <strong>[[${name}]]</strong>,</p>
        <p>
            Mã OTP để đặt lại mật khẩu của bạn là:
            <span style="display:inline-block; font-size:22px; background:#f1556c; color:#fff; padding:8px 28px; border-radius:6px; margin:12px 0 12px 0;">
                    <b>[[${otp}]]</b>
                </span>
        </p>
        <p style="color:#e74c3c; font-size:15px;">
            Lưu ý: Mã OTP chỉ có hiệu lực trong [[${expiryMinutes}]] phút.
        </p>
        <p>Nếu bạn không yêu cầu đặt lại mật khẩu, hãy bỏ qua email này.</p>
    </div>
    <div style="background:#f6f6f6; text-align:center; color:#999; padding:20px; font-size:13px;">
        &copy; quitsmoke.fun 2025
    </div>
</div>
</body>
</html>
